<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <title>Joud Bird VR (fallback)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #085828; }
      #scene-container { position: fixed; inset: 0; touch-action: none; }
      #overlay {
        position: fixed; left: 0; right: 0; top: 0; padding: 12px 16px;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        pointer-events: none; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff;
      }
      #overlay[hidden] { display: none; }
      #enter-vr {
        pointer-events: auto; font: bold 28px 'Segoe UI', Tahoma, sans-serif;
        padding: 18px 48px; border: 3px solid #F8E888; border-radius: 14px;
        background: #085828; color: #F8E8C8; cursor: pointer;
      }
      #enter-vr[hidden] { display: none; }
      #desktop-hint {
        font-size: 15px; color: #F8E8C8; background: rgba(8, 88, 40, 0.88);
        padding: 6px 14px; border-radius: 999px;
      }
      #hud {
        position: fixed; bottom: 8px; left: 8px; margin: 0; padding: 6px 8px;
        background: rgba(0, 0, 0, 0.7); color: #7cfc00; font: 12px monospace;
        direction: ltr; text-align: left; pointer-events: none; white-space: pre;
      }
      #hud[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="overlay">
      <button id="enter-vr" type="button" hidden></button>
      <div id="desktop-hint"></div>
    </div>
    <pre id="hud" hidden></pre>
    <script type="module" src="/src/fallback/main.ts"></script>
  </body>
</html>
