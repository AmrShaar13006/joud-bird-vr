<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#085828" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="data:," />
    <title>Joud Bird</title>
  </head>
  <body>
    <div id="frame">
      <canvas id="game"></canvas>

      <div id="hud" hidden>
        <div id="score">0</div>
        <button id="pause-btn" type="button" aria-label="إيقاف مؤقت">❚❚</button>
      </div>
      <div id="practice-badge" hidden></div>
      <div id="tap-hint" hidden></div>
      <div id="pop" aria-hidden="true"></div>

      <section id="home" class="screen" hidden>
        <h1 id="home-title"></h1>
        <p id="home-mascot" class="sub"></p>
        <p id="home-tagline" class="tag"></p>
        <p id="home-choose" class="label"></p>
        <div id="modes" class="modes"></div>
        <label id="practice-row" class="toggle">
          <input id="practice" type="checkbox" />
          <span id="practice-label"></span>
        </label>
        <p id="home-best" class="best"></p>
        <button id="play-btn" class="primary" type="button"></button>
        <div class="row">
          <button id="board-btn" class="ghost" type="button" hidden></button>
          <button id="name-btn" class="ghost" type="button" hidden></button>
        </div>
        <button id="mute-btn" class="ghost" type="button"></button>
      </section>

      <section id="paused" class="screen" hidden>
        <h2 id="paused-title"></h2>
        <button id="resume-btn" class="primary" type="button"></button>
        <button id="paused-home-btn" class="ghost" type="button"></button>
      </section>

      <section id="over" class="screen" hidden>
        <h2 id="over-title"></h2>
        <p id="over-line" class="tag"></p>
        <dl class="stats">
          <div><dt id="over-score-label"></dt><dd id="over-score"></dd></div>
          <div><dt id="over-flowers-label"></dt><dd id="over-flowers"></dd></div>
          <div class="impact"><dt id="over-impact-label"></dt><dd id="over-impact"></dd></div>
        </dl>
        <p id="over-status" class="status" hidden></p>
        <button id="again-btn" class="primary" type="button"></button>
        <div class="row">
          <button id="over-board-btn" class="ghost" type="button" hidden></button>
          <button id="over-home-btn" class="ghost" type="button"></button>
        </div>
      </section>

      <section id="board" class="screen" hidden>
        <h2 id="board-title"></h2>
        <p id="board-mode" class="label"></p>
        <ol id="board-list" class="board"></ol>
        <p id="board-me" class="best"></p>
        <p id="board-total" class="tag"></p>
        <button id="board-back-btn" class="primary" type="button"></button>
      </section>

      <section id="names" class="screen" hidden>
        <h2 id="names-title"></h2>
        <p id="names-hint" class="sub"></p>
        <div id="names-grid" class="names"></div>
        <button id="names-back-btn" class="ghost" type="button"></button>
      </section>

      <section id="rotate" class="screen" hidden>
        <div class="phone-icon" aria-hidden="true">📱</div>
        <h2 id="rotate-title"></h2>
        <p id="rotate-hint" class="sub"></p>
      </section>

      <pre id="debug" hidden></pre>
    </div>
    <script type="module" src="../src/mobile/main.ts"></script>
  </body>
</html>
